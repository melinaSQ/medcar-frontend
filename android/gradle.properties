org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Evita cachés Kotlin corruptas / "Storage is already registered" tras builds fallidos.
kotlin.incremental=false
# Compila Kotlin en el mismo proceso que Gradle (menos fallos del daemon RMI).
kotlin.compiler.execution.strategy=in-process
# Menos carreras al escribir cachés si varios workers tocan Kotlin a la vez.
org.gradle.parallel=false

# Descargas de Gradle/dependencias más tolerantes a red lenta (evita builds a medias).
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000
